[platformio]
; Use the vendor-baseline env for display bring-up
default_envs = tdeck_plus_vendor

[env]
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=3

; IMPORTANT:
; We are using LilyGO's fork of TFT_eSPI from ./lib/TFT_eSPI
; Do NOT include bodmer/TFT_eSPI in lib_deps.
lib_extra_dirs = lib
lib_deps =

; -------------------------
; T-Deck Plus (Vendor Baseline)
; -------------------------
[env:tdeck_plus_vendor]
; Match LilyGO's known-good PlatformIO platform version
platform = espressif32@6.3.0

; Uses boards/T-Deck.json (copy from LilyGO repo/zip into your project)
board = T-Deck

build_flags =
  ${env.build_flags}
  -DHW_TDECK_PLUS=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DDISPLAY_SMOKETEST=1
  
build_src_filter =
  +<*>
  -<boards/heltec_v3/>

; -------------------------
; Heltec V3 (kept for reference / other hardware)
; -------------------------
[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3

build_flags =
  ${env.build_flags}
  -DHW_HELTEC_V3=1

lib_deps =
  olikraus/U8g2@^2.35.0